<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류</title>
    <style>
        body { margin:0; font-family: Arial, sans-serif; background:#f8fafc; color:#111827; }
        .wrap { max-width: 760px; margin: 24px auto; padding: 20px; }
        .card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:16px; }
        .title { margin:0 0 8px; color:#991b1b; font-size:18px; font-weight:700; }
        .text { margin:0; font-size:14px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1 class="title">요청 처리 중 오류가 발생했습니다.</h1>
        <p class="text">잠시 후 다시 시도해 주세요.</p>
    </div>
</div>
</body>
</html>
