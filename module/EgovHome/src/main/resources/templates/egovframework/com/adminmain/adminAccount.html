<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>관리자 계정 생성 - CCUS 통합관리 시스템</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&amp;family=Public+Sans:wght@400;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style type="text/tailwindcss">
        :root {
            --kr-gov-blue: #00378b;
            --kr-gov-blue-hover: #002d72;
            --kr-gov-green: #006b5d;
            --kr-gov-text-primary: #1a1a1a;
            --kr-gov-text-secondary: #4d4d4d;
            --kr-gov-border-light: #d9d9d9;
            --kr-gov-focus: #005fde;
            --kr-gov-bg-gray: #f2f2f2;
            --kr-gov-radius: 5px;
        }
        @layer base {
            body { font-family: 'Noto Sans KR', 'Public Sans', sans-serif; -webkit-font-smoothing: antialiased; }
            .skip-link {
                @apply absolute -top-full left-0 bg-[var(--kr-gov-blue)] text-white p-3 z-[100] transition-all focus:top-0 focus:outline-none focus:ring-2 focus:ring-white;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'wght' 400, 'opsz' 24;
            font-size: 24px;
            line-height: 1.6;
        }
        .admin-sidebar-link {
            @apply flex items-center gap-3 px-4 py-3 text-[15px] font-medium text-[var(--kr-gov-text-secondary)] hover:bg-gray-100 rounded-[var(--kr-gov-radius)] transition-colors;
        }
        .admin-sidebar-link.active {
            @apply bg-[var(--kr-gov-blue)] text-white font-bold;
        }
        .admin-sidebar-sublink {
            @apply flex items-center gap-2 pl-12 pr-4 py-2 text-[14px] text-[var(--kr-gov-text-secondary)] hover:text-[var(--kr-gov-blue)] hover:font-bold transition-all;
        }
        .admin-sidebar-sublink.active {
            @apply text-[var(--kr-gov-blue)] font-bold relative;
        }
        .admin-sidebar-sublink.active::before {
            content: '';
            @apply absolute left-8 w-1.5 h-1.5 bg-[var(--kr-gov-blue)] rounded-full top-1/2 -translate-y-1/2;
        }
        .gov-card {
            @apply border border-[var(--kr-gov-border-light)] rounded-[var(--kr-gov-radius)] bg-white p-6 shadow-sm;
        }
        .gov-label {
            @apply block text-sm font-bold text-[var(--kr-gov-text-primary)] mb-2;
        }
        .gov-input {
            @apply w-full px-4 py-2.5 border border-[var(--kr-gov-border-light)] rounded-[var(--kr-gov-radius)] focus:outline-none focus:ring-2 focus:ring-[var(--kr-gov-blue)] focus:border-transparent transition-all;
        }
        .gov-btn-primary {
            @apply flex items-center justify-center gap-2 px-6 py-3 bg-[var(--kr-gov-blue)] text-white font-bold rounded-[var(--kr-gov-radius)] hover:bg-[var(--kr-gov-blue-hover)] transition-all shadow-md;
        }
        .gov-btn-secondary {
            @apply flex items-center justify-center gap-2 px-6 py-3 bg-white border border-[var(--kr-gov-border-light)] text-[var(--kr-gov-text-primary)] font-bold rounded-[var(--kr-gov-radius)] hover:bg-gray-50 transition-all;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#00378b",
                        "secondary": "#006b5d",
                        "gov-gray": "#767676",
                    },
                    borderRadius: {
                        'gov': '5px',
                    }
                },
            },
        }
    </script>
</head>

<body class="bg-[#f8f9fa] text-[var(--kr-gov-text-primary)]">
    <a class="skip-link" href="#main-content">본문 바로가기</a>

    <!-- Header fragment inclusion -->
    <div th:replace="~{egovframework/com/adminmain/header :: headerFragment}"></div>

    <div class="flex min-h-[calc(100vh-124px)]">
        <aside class="js-admin-lnb w-72 bg-white border-r border-[var(--kr-gov-border-light)] p-5 flex flex-col" aria-label="관리자 사이드 메뉴">
            <div class="mb-4 px-2 py-2 flex items-center justify-between">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Operation Tools</h2>
                <span class="material-symbols-outlined text-gray-400 cursor-pointer">menu_open</span>
            </div>
            <a class="admin-sidebar-link" href="/adminmain/">
                <span class="material-symbols-outlined">dashboard</span>
                운영 대시보드
            </a>
            <div class="bg-gray-50 rounded-[var(--kr-gov-radius)] border border-gray-100 pb-2">
                <a class="admin-sidebar-link active" href="/adminmain/member/stats">
                    <span class="material-symbols-outlined">group</span>
                    회원·권한 관리
                </a>
                <a class="admin-sidebar-sublink" href="/adminmain/member/list">회원 목록 조회</a>
                <a class="admin-sidebar-sublink" href="/adminmain/auth/group">권한 그룹 설정</a>
                <a class="admin-sidebar-sublink active" href="/adminmain/admin/account">관리자 계정 생성</a>
            </div>
            <a class="admin-sidebar-link" href="#">
                <span class="material-symbols-outlined">terminal</span>
                코드 관리
            </a>
            <a class="admin-sidebar-link" href="#">
                <span class="material-symbols-outlined">analytics</span>
                로그 분석
            </a>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto" id="main-content">
            <div class="max-w-4xl mx-auto">
                <nav aria-label="Breadcrumb" class="flex items-center gap-2 text-sm text-[var(--kr-gov-text-secondary)] mb-4">
                    <span class="material-symbols-outlined text-[18px]">home</span>
                    <span>홈</span>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <span>회원·권한 관리</span>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <span class="font-bold text-[var(--kr-gov-blue)]">관리자 계정 생성</span>
                </nav>
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h2 class="text-2xl font-black text-[var(--kr-gov-text-primary)]">관리자 계정 생성</h2>
                        <p class="text-[var(--kr-gov-text-secondary)] text-sm mt-1">시스템 운영을 위한 새로운 관리자 계정을 발급합니다.</p>
                    </div>
                </div>

                <div class="gov-card">
                    <form action="#" method="POST">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                            <div class="md:col-span-2">
                                <label class="gov-label" for="admin-id">아이디 <span class="text-red-500">*</span></label>
                                <div class="flex gap-2">
                                    <input class="gov-input flex-1" id="admin-id" name="admin-id"
                                        placeholder="영문, 숫자 조합 5~20자" required="" type="text" autocomplete="username" spellcheck="false" />
                                    <button class="gov-btn-secondary px-4 py-2 whitespace-nowrap" type="button">중복
                                        확인</button>
                                </div>
                            </div>
                            <div>
                                <label class="gov-label" for="admin-name">성명 <span class="text-red-500">*</span></label>
                                <input class="gov-input" id="admin-name" name="admin-name" placeholder="실명을 입력하세요"
                                    required="" type="text" autocomplete="name" />
                            </div>
                            <div>
                                <label class="gov-label" for="admin-pw">임시 비밀번호 <span
                                        class="text-red-500">*</span></label>
                                <input class="gov-input" id="admin-pw" name="admin-pw" placeholder="특수문자 포함 10자 이상"
                                    required="" type="password" autocomplete="new-password" />
                            </div>
                            <div>
                                <label class="gov-label" for="dept-name">부서명</label>
                                <input class="gov-input" id="dept-name" name="dept-name" placeholder="소속 부서를 입력하세요"
                                    type="text" autocomplete="organization-title" />
                            </div>
                            <div>
                                <label class="gov-label" for="contact">연락처 <span class="text-red-500">*</span></label>
                                <input class="gov-input" id="contact" name="contact" placeholder="010-0000-0000"
                                    required="" type="tel" autocomplete="tel-national" inputmode="numeric" />
                            </div>
                        </div>
                        <div class="flex items-center justify-end gap-3 pt-8 mt-8 border-t border-gray-100">
                            <button class="gov-btn-secondary min-w-[120px]" type="button">취소</button>
                            <button class="gov-btn-primary min-w-[120px]" type="submit">
                                <span class="material-symbols-outlined text-[20px]">person_add</span> 계정 생성
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Footer fragment inclusion -->
    <div th:replace="~{egovframework/com/adminmain/footer :: footerFragment}"></div>

    <script th:inline="javascript">
        function logout() {
            if (confirm("로그아웃 하시겠습니까?")) {
                fetch('/admin/login/actionLogout', {
                    method: 'POST'
                })
                    .then(response => response.json())
                    .then(response => {
                        if (response.status === 'success') {
                            location.href = '/admin/login/loginView';
                        }
                    });
            }
        }
    </script>
</body>

</html>
