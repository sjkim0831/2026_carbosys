                { title: "대시보드", links: [{ t: "통합 대시보드", u: "../../../Downloads/화면설계/화면설계/화면/admin/monitoring/index.html" }, { t: "운영센터", u: "../../../Downloads/화면설계/화면설계/화면/admin/monitoring/center.html" }, { t: "알림센터", u: "../../../Downloads/화면설계/화면설계/화면/admin/system/notification.html" }] },
                { title: "센서", links: [{ t: "센서 목록", u: "../../../Downloads/화면설계/화면설계/화면/admin/monitoring/sensor_list.html" }, { t: "센서 등록", u: "../../../Downloads/화면설계/화면설계/화면/admin/monitoring/sensor_add.html" }, { t: "센서 설정", u: "../../../Downloads/화면설계/화면설계/화면/admin/monitoring/sensor_edit.html" }] },
                { title: "성능", links: [{ t: "응답속도", u: "../../../Downloads/화면설계/화면설계/화면/admin/system/performance.html" }, { t: "배치 성능", u: "../../../Downloads/화면설계/화면설계/화면/admin/system/batch.html" }, { t: "리소스 사용량", u: "../../../Downloads/화면설계/화면설계/화면/admin/system/infra.html" }] }
            ]}
        };

        var gnbLinks = Array.prototype.slice.call(document.querySelectorAll(".js-gnb-menu"));
        var lnb = document.querySelector(".js-admin-lnb");
        if (!gnbLinks.length || !lnb) {
            return;
        }

        function renderLnb(domain) {
            var isEn = (document.documentElement.lang || "").toLowerCase().indexOf("en") === 0;
            var groups = (domainMenus[domain] && domainMenus[domain].groups) ? domainMenus[domain].groups : [];
            var currentPath = window.location.pathname || "";
            var activeAssigned = false;
            function groupIcon(title) {
                if (title.indexOf("회원") !== -1 || title.indexOf("Members") !== -1) return "group";
                if (title.indexOf("권한") !== -1 || title.indexOf("Permissions") !== -1) return "admin_panel_settings";
                if (title.indexOf("이력") !== -1 || title.indexOf("History") !== -1) return "history";
                if (title.indexOf("배출") !== -1) return "co2";
                if (title.indexOf("인증") !== -1) return "verified";
                if (title.indexOf("감사") !== -1) return "fact_check";
                if (title.indexOf("거래") !== -1) return "receipt_long";
                if (title.indexOf("정산") !== -1) return "payments";
                if (title.indexOf("환불") !== -1) return "currency_exchange";
                if (title.indexOf("게시판") !== -1) return "article";
                if (title.indexOf("가시요소") !== -1) return "deployed_code";
                if (title.indexOf("지원") !== -1) return "support_agent";
                if (title.indexOf("연계") !== -1) return "hub";
                if (title.indexOf("API") !== -1) return "api";
                if (title.indexOf("운영") !== -1) return "dns";
                if (title.indexOf("환경") !== -1) return "settings";
                if (title.indexOf("보안") !== -1) return "security";
                if (title.indexOf("로그") !== -1) return "history";
                if (title.indexOf("백업") !== -1) return "backup";
                if (title.indexOf("대시보드") !== -1) return "dashboard";
                if (title.indexOf("센서") !== -1) return "sensors";
                if (title.indexOf("성능") !== -1) return "monitoring";
                return "folder";
            }
            function subIcon(text) {
                if (text.indexOf("목록") !== -1 || text.indexOf("List") !== -1) return "list_alt";
                if (text.indexOf("승인") !== -1 || text.indexOf("Approve") !== -1 || text.indexOf("Approval") !== -1) return "how_to_reg";
                if (text.indexOf("상세") !== -1 || text.indexOf("Detail") !== -1) return "person_search";
                if (text.indexOf("통계") !== -1 || text.indexOf("Statistics") !== -1 || text.indexOf("Stat") !== -1) return "bar_chart";
                if (text.indexOf("설정") !== -1 || text.indexOf("Config") !== -1 || text.indexOf("Setting") !== -1) return "settings";
                if (text.indexOf("로그") !== -1 || text.indexOf("Log") !== -1 || text.indexOf("이력") !== -1 || text.indexOf("History") !== -1) return "history";
                if (text.indexOf("권한") !== -1 || text.indexOf("Role") !== -1 || text.indexOf("Permission") !== -1) return "admin_panel_settings";
                if (text.indexOf("계정") !== -1 || text.indexOf("Account") !== -1) return "badge";
                if (text.indexOf("검색") !== -1 || text.indexOf("Search") !== -1) return "search";
                if (text.indexOf("대시보드") !== -1 || text.indexOf("Dashboard") !== -1) return "dashboard";
                if (text.indexOf("모니터링") !== -1 || text.indexOf("Monitoring") !== -1) return "monitoring";
                if (text.indexOf("배너") !== -1 || text.indexOf("Banner") !== -1) return "ad";
                if (text.indexOf("팝업") !== -1 || text.indexOf("Popup") !== -1) return "open_in_new";
                if (text.indexOf("API") !== -1) return "api";
                if (text.indexOf("백업") !== -1 || text.indexOf("Backup") !== -1 || text.indexOf("복구") !== -1 || text.indexOf("Restore") !== -1) return "backup";
                return "chevron_right";
            }
            function resolveExistingPath(text) {
                var directMap = {
                    "통합 대시보드": "/adminmain/",
                    "회원 목록": "/adminmain/member/list",
                    "권한 그룹": "/adminmain/auth/group"
                };
                if (directMap[text]) {
                    return directMap[text];
                }
                return "#";
            }
            var groupsHtml = groups.map(function (group, idx) {
                var linksHtml = group.links.map(function (item, linkIdx) {
                    var text = item.text || item.t || "";
                    var href = resolveExistingPath(text);
                    var isActive = false;
                    if (!activeAssigned && href !== "#" && currentPath === href) {
                        isActive = true;
                    } else if (!activeAssigned && idx === 0 && linkIdx === 0) {
                        isActive = true;
                    }
                    if (isActive) {
                        activeAssigned = true;
                    }
                    return '<a class="admin-sidebar-link' + (isActive ? ' active' : '') + '" href="' + href + '"><span class="material-symbols-outlined text-[20px]">' + subIcon(text) + '</span>' + text + '</a>';
                }).join("");
                return '' +
                    '<div class="gnb-tree-group">' +
                    '<button class="gnb-tree-title ' + (idx === 0 ? 'active' : 'inactive') + '" type="button">' +
                    '<span class="flex items-center gap-2"><span class="material-symbols-outlined text-[20px]">' + groupIcon(group.title) + '</span>' + group.title + '</span>' +
                    '<span class="material-symbols-outlined text-[18px] gnb-toggle-icon">' + (idx === 0 ? "expand_more" : "chevron_right") + '</span></button>' +
                    '<div class="gnb-tree-links" style="' + (idx === 0 ? "" : "display:none;") + '">' + linksHtml + '</div>' +
                    '</div>';
            }).join("");

            lnb.innerHTML = '' +
                '<div class="mb-6"><div class="relative">' +
                '<input class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-[var(--kr-gov-radius)] text-sm focus:ring-2 focus:ring-[var(--kr-gov-blue)] focus:border-[var(--kr-gov-blue)] outline-none" id="gnbMenuFilter" placeholder="' + (isEn ? 'Search menu (e.g. log, approval)' : '메뉴 검색 (예: 로그, 승인)') + '" type="text">' +
                '<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-[20px]">search</span>' +
                '</div>' +
                '<div class="space-y-1 overflow-y-auto" id="gnbTreeWrap">' + groupsHtml + '</div>' +
                '<div class="mt-auto border-t pt-5 border-[var(--kr-gov-border-light)]">' +
                '<div class="p-4 bg-blue-50 rounded-[var(--kr-gov-radius)] border border-blue-100">' +
                '<p class="text-[12px] font-bold text-[var(--kr-gov-blue)] mb-1">' + (isEn ? (domain + ' Domain Active') : (domain + ' 도메인 활성화')) + '</p>' +
                '<p class="text-[11px] text-[var(--kr-gov-text-secondary)]">' + (isEn ? ('Currently displaying ' + groups.reduce(function(acc, g){ return acc + g.links.length; }, 0) + ' menus') : ('현재 전체 메뉴 ' + groups.reduce(function(acc, g){ return acc + g.links.length; }, 0) + '개 노출 중')) + '</p>' +
                '</div>' +
                '</div>';

            Array.prototype.forEach.call(lnb.querySelectorAll(".gnb-tree-title"), function (btn) {
                btn.addEventListener("click", function () {
                    var links = btn.nextElementSibling;
                    var marker = btn.querySelector(".gnb-toggle-icon");
                    var open = links.style.display !== "none";
                    links.style.display = open ? "none" : "";
                    marker.textContent = open ? "chevron_right" : "expand_more";
                });
            });

            Array.prototype.forEach.call(lnb.querySelectorAll(".admin-sidebar-link"), function (a) {
                a.addEventListener("click", function () {
                    Array.prototype.forEach.call(lnb.querySelectorAll(".admin-sidebar-link.active"), function (activeEl) {
                        activeEl.classList.remove("active");
                    });
                    a.classList.add("active");
                });
            });

            var filter = lnb.querySelector("#gnbMenuFilter");
            filter.addEventListener("input", function () {
                var keyword = filter.value.trim().toLowerCase();
                Array.prototype.forEach.call(lnb.querySelectorAll(".gnb-tree-group"), function (groupEl) {
                    var title = groupEl.querySelector(".gnb-tree-title").textContent.toLowerCase();
                    var visibleCount = 0;
                    Array.prototype.forEach.call(groupEl.querySelectorAll(".gnb-tree-links a"), function (a) {
                        var show = a.textContent.toLowerCase().indexOf(keyword) !== -1 || title.indexOf(keyword) !== -1;
                        a.style.display = show ? "" : "none";
                        if (show) {
                            visibleCount += 1;
                        }
                    });
                    groupEl.style.display = visibleCount > 0 || keyword === "" ? "" : "none";
                });
            });
        }

        function setActive(domain) {
            gnbLinks.forEach(function (link) {
                var active = link.getAttribute("data-domain") === domain;
                link.classList.toggle("text-[var(--kr-gov-blue)]", active);
                link.classList.toggle("border-b-4", active);
                link.classList.toggle("border-[var(--kr-gov-blue)]", active);
                link.classList.toggle("text-[var(--kr-gov-text-secondary)]", !active);
                link.classList.toggle("hover:text-[var(--kr-gov-blue)]", !active);
            });
        }

        var savedDomain = window.localStorage.getItem("adminGnbDomain");
        var currentDomain = domainMenus[savedDomain] ? savedDomain : "회원관리";
        setActive(currentDomain);
        renderLnb(currentDomain);

        gnbLinks.forEach(function (link) {
            link.addEventListener("click", function (e) {
                var domain = link.getAttribute("data-domain");
                if (!domainMenus[domain]) {
                    return;
                }
                e.preventDefault();
                window.localStorage.setItem("adminGnbDomain", domain);
                setActive(domain);
                renderLnb(domain);
            });
        });
    });
</script>

</header>

</html>
