<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<header th:fragment="headerFragment" class="bg-white border-b border-[var(--kr-gov-border-light)] sticky top-0 z-40">
    <div class="bg-[var(--kr-gov-bg-gray)] border-b border-[var(--kr-gov-border-light)]">
        <div class="max-w-full mx-auto px-6 py-1.5 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <img alt="대한민국정부 상징" class="h-3.5"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8BPzqtzSLVGSrjt4mzhhVBy9SocCRDssk1F3XRVu7Xq9jHh7qzzt48wFi8qduCiJmB0LRQczPB7waPe3h0gkjn3jOEDxt6UJSJjdXNf8P-4WlM2BEZrfg2SL91uSiZrFcCk9KYrsdg-biTS9dtJ_OIghDBEVoAzMc33XcCYR_UP0QQdoYzBe840YrtH40xGyB9MSr0QH4D0foqlvOhG0jX8CDayXNlDsSKlfClVd3K2aodlwg4xSxgXHB3vnnnA0L2yNBNihQQg0" />
                <span class="text-[12px] font-medium text-[var(--kr-gov-text-secondary)]">대한민국정부 공식 누리집</span>
            </div>
            <div class="flex items-center gap-4 text-[11px] font-medium text-[var(--kr-gov-text-secondary)]">
                <span th:if="${loginVO != null}">관리자 로그인: <span th:text="${loginVO.userName}">홍길동</span></span>
                <button class="hover:underline" onclick="logout()">로그아웃</button>
            </div>
        </div>
    </div>
    <div class="max-w-full mx-auto px-6">
        <div class="flex justify-between items-center h-20">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-[32px] text-[var(--kr-gov-blue)]">eco</span>
                    <div class="flex flex-col">
                        <h1 class="text-xl font-bold tracking-tight text-[var(--kr-gov-text-primary)]">CCUS 통합관리 시스템
                        </h1>
                        <p class="text-[10px] text-[var(--kr-gov-blue)] font-black uppercase tracking-widest">Admin
                            Dashboard</p>
                    </div>
                </div>
            </div>
            <nav class="hidden xl:flex items-center space-x-2 h-full">
                <a class="px-5 py-2 text-[16px] font-bold"
                    th:classappend="${#httpServletRequest.requestURI == '/adminmain/'} ? 'text-[var(--kr-gov-blue)] border-b-4 border-[var(--kr-gov-blue)]' : 'text-[var(--kr-gov-text-secondary)] hover:text-[var(--kr-gov-blue)]'"
                    href="/adminmain/">운영 대시보드</a>
                <a class="px-5 py-2 text-[16px] font-bold"
                    th:classappend="${#httpServletRequest.requestURI == '/adminmain/member/stats'} ? 'text-[var(--kr-gov-blue)] border-b-4 border-[var(--kr-gov-blue)]' : 'text-[var(--kr-gov-text-secondary)] hover:text-[var(--kr-gov-blue)]'"
                    href="/adminmain/member/stats">회원·권한 관리</a>
                <a class="px-5 py-2 text-[16px] font-bold text-[var(--kr-gov-text-secondary)] hover:text-[var(--kr-gov-blue)]"
                    href="#">산정 로직 관리</a>
                <a class="px-5 py-2 text-[16px] font-bold text-[var(--kr-gov-text-secondary)] hover:text-[var(--kr-gov-blue)]"
                    href="#">인증·심사 관리</a>
                <a class="px-5 py-2 text-[16px] font-bold text-[var(--kr-gov-text-secondary)] hover:text-[var(--kr-gov-blue)]"
                    href="#">통계·리포트</a>
                <a class="px-5 py-2 text-[16px] font-bold text-[var(--kr-gov-text-secondary)] hover:text-[var(--kr-gov-blue)]"
                    href="http://localhost:18030/admin/msa/manager" target="_blank">모듈 관리</a>
                <a class="px-5 py-2 text-[16px] font-bold text-[var(--kr-gov-text-secondary)] hover:text-[var(--kr-gov-blue)]"
                    href="#">시스템 설정</a>
            </nav>
            <div class="flex items-center gap-1">
                <div class="relative help-button">
                    <button
                        class="p-2.5 text-[var(--kr-gov-text-secondary)] hover:bg-gray-100 rounded-full flex items-center gap-1.5">
                        <span class="material-symbols-outlined">help</span>
                        <span class="text-[14px] font-bold hidden lg:inline">도움말</span>
                    </button>
                    <div class="help-tooltip">
                        <h4 class="font-bold text-[var(--kr-gov-blue)] mb-2 flex items-center gap-1">
                            <span class="material-symbols-outlined text-[18px]">info</span> 도움말 안내
                        </h4>
                        <p class="text-[12px] text-[var(--kr-gov-text-secondary)]">관리자 페이지의 각 메뉴 기능을 안내합니다.</p>
                    </div>
                </div>
                <button class="p-2.5 text-[var(--kr-gov-text-secondary)] hover:bg-gray-100 rounded-full relative">
                    <span class="material-symbols-outlined">notifications</span>
                    <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                </button>
                <button class="p-2.5 text-[var(--kr-gov-text-secondary)] hover:bg-gray-100 rounded-full">
                    <span class="material-symbols-outlined">settings</span>
                </button>
            </div>
        </div>
    </div>
</header>

</html>
