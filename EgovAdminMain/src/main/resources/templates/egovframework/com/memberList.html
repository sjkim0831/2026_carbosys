<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>관리자 회원 목록 조회 - CCUS 통합관리 시스템</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&amp;family=Public+Sans:wght@400;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style type="text/tailwindcss">
        :root {
            --kr-gov-blue: #00378b;
            --kr-gov-blue-hover: #002d72;
            --kr-gov-green: #006b5d;
            --kr-gov-text-primary: #1a1a1a;
            --kr-gov-text-secondary: #4d4d4d;
            --kr-gov-border-light: #d9d9d9;
            --kr-gov-focus: #005fde;
            --kr-gov-bg-gray: #f2f2f2;
            --kr-gov-radius: 5px;
        }
        @layer base {
            body { font-family: 'Noto Sans KR', 'Public Sans', sans-serif; -webkit-font-smoothing: antialiased; }
            .skip-link {
                @apply absolute -top-full left-0 bg-[var(--kr-gov-blue)] text-white p-3 z-[100] transition-all focus:top-0 focus:outline-none focus:ring-2 focus:ring-white;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'wght' 400, 'opsz' 24;
            font-size: 24px;
            line-height: 1.6;
        }
        .admin-sidebar-link {
            @apply flex items-center gap-3 px-4 py-3 text-[15px] font-medium text-[var(--kr-gov-text-secondary)] hover:bg-gray-100 rounded-[var(--kr-gov-radius)] transition-colors;
        }
        .admin-sidebar-link.active {
            @apply bg-[var(--kr-gov-blue)] text-white font-bold;
        }
        .admin-sidebar-sublink {
            @apply flex items-center gap-2 pl-12 pr-4 py-2 text-[14px] text-[var(--kr-gov-text-secondary)] hover:text-[var(--kr-gov-blue)] hover:font-bold transition-all;
        }
        .admin-sidebar-sublink.active {
            @apply text-[var(--kr-gov-blue)] font-bold relative;
        }
        .admin-sidebar-sublink.active::before {
            content: '';
            @apply absolute left-8 w-1.5 h-1.5 bg-[var(--kr-gov-blue)] rounded-full top-1/2 -translate-y-1/2;
        }
        .gov-card {
            @apply border border-[var(--kr-gov-border-light)] rounded-[var(--kr-gov-radius)] bg-white p-6 shadow-sm;
        }
        .help-tooltip {
            @apply invisible opacity-0 absolute right-0 top-full mt-2 w-72 p-4 bg-white border border-[var(--kr-gov-border-light)] rounded-[var(--kr-gov-radius)] shadow-xl z-50 text-sm transition-all;
        }
        .help-button:hover .help-tooltip {
            @apply visible opacity-100;
        }
        .gov-table-header {
            @apply bg-gray-50 border-y border-[var(--kr-gov-border-light)] text-[14px] font-bold text-[var(--kr-gov-text-secondary)];
        }
        .status-badge {
            @apply px-2 py-0.5 text-[11px] font-bold rounded-full;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#00378b",
                        "secondary": "#006b5d",
                        "gov-gray": "#767676",
                    },
                    borderRadius: {
                        'gov': '5px',
                    }
                },
            },
        }
    </script>
</head>

<body class="bg-[#f8f9fa] text-[var(--kr-gov-text-primary)]">
    <a class="skip-link" href="#main-content">본문 바로가기</a>

    <!-- Header fragment inclusion -->
    <div th:replace="~{header :: headerFragment}"></div>

    <div class="flex min-h-[calc(100vh-124px)]">
        <aside class="w-64 bg-white border-r border-[var(--kr-gov-border-light)] p-4 flex flex-col gap-2">
            <div class="mb-4 px-2 py-2 flex items-center justify-between">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Operation Tools</h2>
                <span class="material-symbols-outlined text-gray-400 cursor-pointer">menu_open</span>
            </div>
            <a class="admin-sidebar-link" href="/adminmain/">
                <span class="material-symbols-outlined">dashboard</span>
                운영 대시보드
            </a>
            <div class="bg-gray-50 rounded-[var(--kr-gov-radius)] border border-gray-100 pb-2">
                <a class="admin-sidebar-link active" href="/adminmain/member/stats">
                    <span class="material-symbols-outlined">group</span>
                    회원·권한 관리
                </a>
                <a class="admin-sidebar-sublink active" href="/adminmain/member/list">회원 목록 조회</a>
                <a class="admin-sidebar-sublink" href="#">권한 그룹 설정</a>
                <a class="admin-sidebar-sublink" href="#">관리자 계정 생성</a>
            </div>
            <a class="admin-sidebar-link" href="#">
                <span class="material-symbols-outlined">terminal</span>
                코드 관리
            </a>
            <a class="admin-sidebar-link" href="#">
                <span class="material-symbols-outlined">analytics</span>
                로그 분석
            </a>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto" id="main-content">
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h2 class="text-2xl font-black text-[var(--kr-gov-text-primary)]">회원 목록 조회</h2>
                    <p class="text-[var(--kr-gov-text-secondary)] text-sm mt-1">시스템에 등록된 전체 회원을 조회하고 관리합니다.</p>
                </div>
                <div class="flex gap-2">
                    <button
                        class="flex items-center gap-1 px-4 py-2 bg-[var(--kr-gov-blue)] text-white rounded-[var(--kr-gov-radius)] text-[14px] font-bold hover:bg-[var(--kr-gov-blue-hover)] transition-all">
                        <span class="material-symbols-outlined text-[20px]">person_add</span> 신규 회원 등록
                    </button>
                </div>
            </div>

            <div class="gov-card">
                <!-- Search filters would go here -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="gov-table-header">
                                <th class="px-6 py-4">사용자 ID</th>
                                <th class="px-6 py-4">성명/기업명</th>
                                <th class="px-6 py-4">유형</th>
                                <th class="px-6 py-4">상태</th>
                                <th class="px-6 py-4">가입일</th>
                                <th class="px-6 py-4 text-center">관리</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <tr class="hover:bg-gray-50/50 transition-colors">
                                <td class="px-6 py-4 font-medium">user_demo_01</td>
                                <td class="px-6 py-4">(주)에코그린시스템</td>
                                <td class="px-6 py-4"><span class="text-blue-600 font-bold">기업</span></td>
                                <td class="px-6 py-4"><span
                                        class="status-badge bg-emerald-100 text-emerald-700">정상</span></td>
                                <td class="px-6 py-4 text-gray-500">2025.08.12</td>
                                <td class="px-6 py-4 text-center">
                                    <button
                                        class="text-xs font-bold text-[var(--kr-gov-blue)] hover:underline">수정</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Footer fragment inclusion -->
    <div th:replace="~{footer :: footerFragment}"></div>

    <script th:inline="javascript">
        function logout() {
            if (confirm("로그아웃 하시겠습니까?")) {
                fetch('/admin/login/actionLogout', {
                    method: 'POST'
                })
                    .then(response => response.json())
                    .then(response => {
                        if (response.status === 'success') {
                            location.href = '/admin/login/loginView';
                        }
                    });
            }
        }
    </script>
</body>

</html>
