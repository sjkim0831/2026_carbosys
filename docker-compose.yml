services:
  cubrid:
    image: cubrid/cubrid:11.2
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -lc
      - >
        mkdir -p /var/lib/cubrid && exec /entrypoint.sh
    environment:
      TZ: Asia/Seoul
      CUBRID_DB: com
      CUBRID_LOCALE: ko_KR.utf8
      CUBRID_CHARSET: utf8
      DB_ROOT_PASSWORD: ""
      CUBRID_COMPONENTS: ALL
      CUBRID_DATABASES: /var/lib/cubrid
      CUBRID_CONF: /opt/carbosys/conf/cubrid.conf
      CUBRID_BROKER_CONF: /opt/carbosys/conf/cubrid_broker.conf
    volumes:
      - "./infra/cubrid/init:/docker-entrypoint-initdb.d"
      - "./infra/cubrid/conf:/opt/carbosys/conf"
      - "./data:/var/lib/cubrid"
    healthcheck:
      test: [ "CMD-SHELL", "cubrid server status com | grep -q 'Server com'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    platform: linux/x86_64
    hostname: cubrid
    shm_size: '2gb'
    privileged: true
    container_name: cubrid
    ports:
      - "33000:33000"
      - "33001:33001"
    networks:
      - carbosys-net

  carbosys-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MSA_MANAGER_XMS: "512m"
      MSA_MANAGER_XMX: "1024m"
    depends_on:
      cubrid:
        condition: service_healthy
    ports:
      - "8761:8761"
      - "9000:9000"
      - "18030:18030"
    container_name: carbosys-app
    hostname: carbosys-app
    networks:
      - carbosys-net
    volumes:
      - "./file:/opt/carbosys/file"
      - "./module:/opt/carbosys/module"
      - "./logs:/opt/carbosys/logs"
    extra_hosts:
      - "localhost:127.0.0.1"

  jenkins:
    profiles: [ "ci" ]
    build:
      context: .
      dockerfile: infra/jenkins/Dockerfile
    container_name: carbosys-jenkins
    user: "0:0"
    restart: unless-stopped
    depends_on:
      - carbosys-app
    ports:
      - "18081:8080"
      - "50000:50000"
    environment:
      TZ: Asia/Seoul
    networks:
      - carbosys-net
    volumes:
      - "jenkins_home:/var/jenkins_home"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./:/opt/carbosys"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --url http://carbosys-app:9000
    networks:
      - carbosys-net

networks:
  carbosys-net:
    driver: bridge

volumes:
  jenkins_home: {}
