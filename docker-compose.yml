services:
  cubrid:
    image: cubrid/cubrid:11.2
    environment:
      TZ: Asia/Seoul
      CUBRID_DB: com
      CUBRID_LOCALE: ko_KR.utf8
      CUBRID_CHARSET: utf8
      DB_ROOT_PASSWORD: ""
      CUBRID_COMPONENTS: ALL
      CUBRID_DATABASES: /opt/carbosys/data
      CUBRID_CONF: /opt/carbosys/conf/cubrid.conf
      CUBRID_BROKER_CONF: /opt/carbosys/conf/cubrid_broker.conf
    volumes:
      - "./infra/cubrid/init:/docker-entrypoint-initdb.d"
      - "./infra/cubrid/conf:/opt/carbosys/conf"
      - "${CUBRID_DATA_DIR:-/opt/carbosys/data}:/opt/carbosys/data"
    platform: linux/x86_64
    hostname: cubrid
    shm_size: '2gb'
    privileged: true
    container_name: cubrid
    ports:
      - "33000:33000"
      - "33001:33001"
    networks:
      - carbosys-net

  carbosys-app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - cubrid
    ports:
      - "8761:8761"
      - "9000:9000"
      - "18030:18030"
    container_name: carbosys-app
    hostname: carbosys-app
    networks:
      - carbosys-net
    volumes:
      - "./file:/opt/carbosys/file"
      - "./module:/opt/carbosys/module"
      - "./module/EgovHome:/opt/carbosys/module/EgovHome"
      - "./logs:/opt/carbosys/logs"
    extra_hosts:
      - "localhost:127.0.0.1"

  jenkins:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: infra/jenkins/Dockerfile
    container_name: carbosys-jenkins
    user: "0:0"
    restart: unless-stopped
    depends_on:
      - carbosys-app
    ports:
      - "18081:8080"
      - "50000:50000"
    environment:
      TZ: Asia/Seoul
    networks:
      - carbosys-net
    volumes:
      - "jenkins_home:/var/jenkins_home"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./:/opt/carbosys"

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://carbosys-app:9000
    networks:
      - carbosys-net

networks:
  carbosys-net:
    driver: bridge

volumes:
  jenkins_home: {}
