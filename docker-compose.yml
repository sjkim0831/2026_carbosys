services:
  cubrid:
    image: cubrid/cubrid:11.2
    environment:
      TZ: Asia/Seoul
      CUBRID_DB: com
      CUBRID_LOCALE: ko_KR.utf8
      DB_ROOT_PASSWORD: ""
      CUBRID_COMPONENTS: SERVER
      CUBRID_DATABASES: /opt/carbosys/data
    volumes:
      - "./infra/cubrid/init:/docker-entrypoint-initdb.d"
      - "cubrid-data:/opt/carbosys/data"
    platform: linux/x86_64
    hostname: cubrid
    shm_size: '2gb'
    privileged: true
    container_name: cubrid
    ports:
      - "33000:33000"
    networks:
      - carbosys-net

  carbosys-app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - cubrid
    ports:
      - "8761:8761"
      - "9000:9000"
      - "18030:18030"
    container_name: carbosys-app
    hostname: carbosys-app
    networks:
      - carbosys-net
    volumes:
      - "carbosys-file-data:/opt/carbosys/file"
    extra_hosts:
      - "localhost:127.0.0.1"

networks:
  carbosys-net:
    driver: bridge

volumes:
  cubrid-data:
  carbosys-file-data:
