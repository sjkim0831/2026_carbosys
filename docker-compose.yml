services:
  cubrid:
    image: cubrid/cubrid:11.2
    environment:
      TZ: Asia/Seoul
      CUBRID_DB: com
      CUBRID_LOCALE: ko_KR.utf8
      DB_ROOT_PASSWORD: ""
      CUBRID_COMPONENTS: ALL
      CUBRID_DATABASES: /opt/data
    volumes:
      - "./infra/cubrid/init:/docker-entrypoint-initdb.d"
      - "./infra/cubrid/conf/cubrid.conf:/home/cubrid/CUBRID/conf/cubrid.conf"
      - "./infra/cubrid/conf/cubrid_broker.conf:/home/cubrid/CUBRID/conf/cubrid_broker.conf"
      - "./data:/opt/data"
      - "cubrid-data:/home/cubrid/CUBRID/databases"
    platform: linux/x86_64
    hostname: cubrid
    shm_size: '2gb'
    privileged: true
    container_name: cubrid
    ports:
      - "33000:33000"
    networks:
      - carbosys-net

  carbosys-app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - cubrid
    ports:
      - "8761:8761"
      - "9000:9000"
      - "18030:18030"
    container_name: carbosys-app
    hostname: carbosys-app
    networks:
      - carbosys-net
    volumes:
      - "./file:/opt/carbosys/file"
      - "./module:/opt/carbosys/module"
      - "./module/msa-manager:/opt/carbosys/module/msa-manager"
    extra_hosts:
      - "localhost:127.0.0.1"

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://carbosys-app:9000
    networks:
      - carbosys-net

networks:
  carbosys-net:
    driver: bridge

volumes:
  cubrid-data:
