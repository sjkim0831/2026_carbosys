  # ============================================================
  # EgovBoard (Port: 18003)
  # ============================================================
  - path: "/cop/brd/**"
    module: "EgovBoard"
    description: "게시판 (Board) 서비스"
    method: "GET/POST"
    uiElements:
      - element: "검색 필터 (searchCondition)"
        function: "셀렉트"
        details: "제목, 내용, 등록자 등 검색 조건을 선택합니다."
      - element: "검색어 입력 (searchKeyword)"
        function: "입력"
        details: "검색할 키워드를 입력합니다."
      - element: "조회 버튼"
        function: "boardSearch()"
        details: "입력된 조건으로 게시물 목록을 필터링합니다."
        inputs: ["searchCondition", "searchKeyword"]
        calls: ["/cop/brd/boardList"]
      - element: "글쓰기 버튼"
        function: "boardCreate()"
        details: "게시물 등록 화면으로 이동합니다."
      - element: "게시물 제목 링크"
        function: "boardDetail(nttId)"
        details: "상세 내용을 보기 위해 상세 화면으로 이동합니다."
        inputs: ["nttId"]
    params:
      - name: "bbsId"
        type: "String"
        required: false
        description: "게시판 ID"
      - name: "nttId"
        type: "long"
        required: false
        description: "게시물 ID"

  - path: "/cop/cmy/**"
