  # ============================================================
  - path: "/mip/**"
    module: "EgovMobileId"
    description: "모바일 신분증 인증 (MIP 프로토콜)"
    method: "GET/POST"
    uiElements:
      - element: "신분증 유형 탭"
        function: "location.href 전환"
        details: "운전면허증(driver), 국가유공자증(honor), 재외국민증(expat) 중 하나를 선택합니다."
        inputs: ["license"]
      - element: "QR정보 요청 버튼"
        function: "qrInfoReqBtn 클릭"
        details: "모바일 신분증 인증을 위한 QR 코드를 생성 요청합니다."
      - element: "진행상태 확인 버튼"
        function: "trxstsBtn 클릭"
        details: "현재 인증 진행 상태를 서버에서 조회하여 결과 영역에 표시합니다."
      - element: "상태 초기화 버튼"
        function: "resetTrxstsBtn 클릭"
        details: "진행 중인 인증 트랜잭션을 초기화합니다."
      - element: "인증 결과 영역"
        function: "결과 데이터 바인딩"
        details: "이름, 생년월일, 주소 및 사진 정보를 복호화하여 화면에 출력합니다."

