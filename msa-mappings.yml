  # ============================================================
  # signin (Port: 18060)
  # ============================================================
  - path: "/signin/**"
    module: "signin"
    description: "통합 사인인 서비스 (Unified Login)"
    method: "GET/POST"
    uiElements:
      - element: "사용자 유형 탭 (국내/해외)"
        function: "탭 전환 (JS)"
        details: "국내 사용자(GNR) 또는 해외 사업자(ENT) 유형을 선택합니다."
      - element: "아이디/비밀번호 입력"
        function: "Form Input"
        details: "로그인 정보를 입력합니다."
      - element: "자동 로그인/ID 저장"
        function: "체크박스"
        details: "브라우저 쿠키를 통해 정보를 저장합니다."
      - element: "로그인 버튼"
        function: "loginProcess()"
        details: "통합 인증 서버로 계정 정보를 검증 요청합니다."
        calls: ["/signin/actionLogin"]
      - element: "간편인증 버튼"
        function: "외부 연동"
        details: "카카오, 토스 등 외부 인증 수단을 호출합니다."
      - element: "증명인증 버튼"
        function: "인증서 호출"
        details: "공동인증서 또는 금융인증서를 통한 로그인을 시도합니다."

  # ============================================================
  # EgovMain (Port: 18001)
  # ============================================================
  - path: "/"
    module: "EgovMain"
    description: "사용자 메인 페이지 (Layout)"
    method: "GET"
    uiElements:
      - element: "메인 레이아웃 (Side Menu)"
        function: "loadContent(url)"
        details: "사이드바 메뉴 클릭 시 해당 컨텐츠를 중앙 뷰어(custom-viewer)에 비동기로 로드합니다."
        inputs: ["data-url"]
      - element: "중앙 컨텐츠 뷰어"
        function: "custom-viewer"
        details: "선택된 페이지의 내용을 iframe 형태로 표시하고 높이를 자동 조절합니다."
      - element: "본문 바로가기"
        function: "Skip Link"
        details: "접근성을 위한 본문 영역 이동 링크입니다."
