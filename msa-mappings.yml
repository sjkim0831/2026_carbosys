        details: "사용자의 PC 또는 토큰에 저장된 공동인증서를 목록에 표시합니다."
      - element: "비밀번호 입력"
        function: "인증서 암호 확인"
        details: "선택한 인증서의 개인키 암호를 확인합니다."
      - element: "인증서 로그인 버튼"
        function: "actionLogin()"
        details: "인증서 서명 값을 서버로 전달하여 본인 확인을 수행합니다."
        calls: ["/uat/uia/actionLogin"]

