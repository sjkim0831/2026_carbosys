<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>신규 회원사 등록 - CCUS 통합관리 포털</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Public+Sans:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style type="text/tailwindcss">
        :root {
            --kr-gov-blue: #00378b;
            --kr-gov-blue-hover: #002d72;
            --kr-gov-text-primary: #1a1a1a;
            --kr-gov-text-secondary: #4d4d4d;
            --kr-gov-border-light: #d9d9d9;
            --kr-gov-focus: #005fde;
            --kr-gov-bg-gray: #f8f9fa;
            --kr-gov-radius: 5px;
            --kr-gov-error: #d32f2f;
            --kr-gov-success: #2e7d32;
            --kr-gov-green: #00857c;
        }
        @layer base {
            body { font-family: 'Noto Sans KR', 'Public Sans', sans-serif; -webkit-font-smoothing: antialiased; }
            .skip-link { @apply absolute -top-full left-0 bg-[var(--kr-gov-blue)] text-white p-3 z-[100] transition-all focus:top-0 focus:outline-none focus:ring-2 focus:ring-white; }
            .focus-visible:focus-visible { outline: 3px solid var(--kr-gov-focus); outline-offset: 2px; }
            .form-label { @apply block text-sm font-bold text-[var(--kr-gov-text-primary)] mb-2; }
            .form-input { @apply w-full h-12 px-4 border border-[var(--kr-gov-border-light)] rounded-[var(--kr-gov-radius)] focus:ring-2 focus:ring-[var(--kr-gov-focus)] focus:border-transparent transition-all outline-none bg-white; }
            .section-title { @apply text-lg font-bold text-[var(--kr-gov-text-primary)] flex items-center gap-2 mb-6 pb-2 border-b-2 border-gray-100; }
            .notification-banner { @apply bg-blue-50 border border-blue-100 p-4 rounded-[var(--kr-gov-radius)] mb-8 flex items-start gap-3; }
        }
        .material-symbols-outlined { font-variation-settings: 'wght' 400, 'opsz' 24; font-size: 24px; }
        .step-item { @apply flex flex-col items-center relative flex-1; }
        .step-circle { @apply w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold border-2 z-10 bg-white; }
        .step-active .step-circle { @apply bg-[var(--kr-gov-blue)] border-[var(--kr-gov-blue)] text-white ring-4 ring-blue-100; }
        .step-completed .step-circle { @apply bg-white border-[var(--kr-gov-blue)] text-[var(--kr-gov-blue)]; }
        .step-inactive .step-circle { @apply border-[var(--kr-gov-border-light)] text-[var(--kr-gov-text-secondary)]; }
        .step-line { @apply absolute top-5 left-1/2 w-full h-[2px] bg-[var(--kr-gov-border-light)]; }
        .step-completed .step-line { @apply bg-[var(--kr-gov-blue)]; }
        .drop-zone { @apply mt-2 flex flex-col items-center justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer outline-none focus:ring-2 focus:ring-[var(--kr-gov-focus)]; }
        /* 회원가입 페이지: 헤더 로그인 버튼/내비게이션 숨김 */
        #loginBtn { display: none !important; }
        header nav { display: none !important; }
        .gov-btn { display: none !important; }
        /* KO/EN 버튼: KO 활성 */
        #langKoBtn { @apply bg-[var(--kr-gov-blue)] text-white; }
        #langEnBtn { @apply bg-white text-[var(--kr-gov-text-secondary)] hover:bg-gray-100; }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: { colors: { "primary": "#00378b", "gov-gray": "#767676", "gov-green": "#00857c" }, borderRadius: { 'gov': '5px' } },
            },
        }
    </script>
</head>

<body class="bg-[var(--kr-gov-bg-gray)] text-[var(--kr-gov-text-primary)] min-h-screen flex flex-col">
    <a class="skip-link" href="#main-content">본문 바로가기</a>
    <div id="shared-header"></div>

    <main class="flex-grow py-12 px-4" id="main-content">
        <div class="max-w-[850px] mx-auto">
            <div class="mb-12">
                <h2 class="text-3xl font-bold text-center mb-8">회원가입</h2>
                <div class="max-w-5xl mx-auto">
                    <div class="flex justify-between relative">
                        <div class="step-item step-completed">
                            <div class="step-line"></div>
                            <div class="step-circle"><span class="material-symbols-outlined !text-[20px]">check</span>
                            </div>
                            <span class="mt-3 text-sm font-medium text-[var(--kr-gov-text-secondary)]">회원유형</span>
                        </div>
                        <div class="step-item step-completed">
                            <div class="step-line"></div>
                            <div class="step-circle"><span class="material-symbols-outlined !text-[20px]">check</span>
                            </div>
                            <span class="mt-3 text-sm font-medium text-[var(--kr-gov-text-secondary)]">약관 동의</span>
                        </div>
                        <div class="step-item step-completed">
                            <div class="step-line"></div>
                            <div class="step-circle"><span class="material-symbols-outlined !text-[20px]">check</span>
                            </div>
                            <span class="mt-3 text-sm font-medium text-[var(--kr-gov-text-secondary)]">본인 확인</span>
                        </div>
                        <div class="step-item step-active">
                            <div class="step-line"></div>
                            <div class="step-circle">04</div>
                            <span class="mt-3 text-sm font-bold text-[var(--kr-gov-blue)]">정보 입력</span>
                        </div>
                        <div class="step-item step-inactive">
                            <div class="step-circle">05</div>
                            <span class="mt-3 text-sm font-medium text-[var(--kr-gov-text-secondary)]">가입 완료</span>
                        </div>
                    </div>
                </div>
            </div>

            <div
                class="bg-white border border-[var(--kr-gov-border-light)] rounded-lg shadow-sm overflow-hidden p-8 md:p-12">
                <div class="mb-8">
                    <h3 class="text-2xl font-bold text-[var(--kr-gov-text-primary)] mb-4">신규 회원사 등록</h3>
                    <div class="notification-banner">
                        <span class="material-symbols-outlined text-blue-600">info</span>
                        <p class="text-[15px] text-blue-800 leading-relaxed">
                            검색 결과 소속 정보가 없는 경우, <strong>신규 회원사로 등록한 후</strong> 가입을 진행하실 수 있습니다.
                            입력하신 정보는 관리자의 승인 절차를 거치게 됩니다.
                        </p>
                    </div>
                </div>

                <form action="/join/companyRegisterSubmit" method="post" enctype="multipart/form-data"
                    class="space-y-8">
                    <input type="hidden" name="lang" value="ko" />
                    <section>
                        <h4 class="section-title">
                            <span class="material-symbols-outlined text-[var(--kr-gov-blue)]">business_center</span>
                            회원사 기본 정보
                        </h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-6">
                            <div class="md:col-span-2 space-y-1">
                                <label class="form-label" for="agency-name">기관/기업명 <span aria-hidden="true"
                                        class="text-red-500">*</span></label>
                                <input class="form-input" id="agency-name" name="agencyName"
                                    placeholder="정식 명칭을 입력하세요 (예: (주)한국에너지기술)" required type="text" />
                            </div>
                            <div class="space-y-1">
                                <label class="form-label" for="representative-name">대표자명 <span aria-hidden="true"
                                        class="text-red-500">*</span></label>
                                <input class="form-input" id="representative-name" name="representativeName"
                                    placeholder="대표자 성함을 입력하세요" required type="text" />
                            </div>
                            <div class="space-y-1">
                                <label class="form-label" for="biz-registration-number">사업자등록번호 <span aria-hidden="true"
                                        class="text-red-500">*</span></label>
                                <div class="flex gap-2">
                                    <input class="form-input" id="biz-registration-number" name="bizRegistrationNumber"
                                        placeholder="숫자만 입력 (10자리)" required type="text" />
                                </div>
                            </div>
                            <div class="md:col-span-2 space-y-1">
                                <label class="form-label" for="company-address">사업장 주소 <span aria-hidden="true"
                                        class="text-red-500">*</span></label>
                                <div class="flex gap-2 mb-2">
                                    <input class="form-input w-32 bg-gray-50 cursor-pointer" id="zip-code"
                                        name="zipCode" placeholder="우편번호" type="text" required readonly
                                        onclick="execDaumPostcode()" />
                                    <button
                                        class="px-5 border border-[var(--kr-gov-blue)] text-[var(--kr-gov-blue)] text-sm font-bold rounded-[var(--kr-gov-radius)] hover:bg-blue-50 transition-colors"
                                        type="button" onclick="execDaumPostcode()">주소 검색</button>
                                </div>
                                <input class="form-input mb-2 bg-gray-50 cursor-pointer" id="company-address"
                                    name="companyAddress" placeholder="기본 주소를 입력하세요" type="text" required readonly
                                    onclick="execDaumPostcode()" />
                                <input class="form-input" id="company-address-detail" name="companyAddressDetail"
                                    placeholder="상세 주소를 입력하세요" type="text" />
                            </div>
                        </div>
                    </section>
                    <section>
                        <h4 class="section-title">
                            <span class="material-symbols-outlined text-[var(--kr-gov-blue)]">upload_file</span>
                            증빙 서류 제출
                        </h4>
                        <div class="space-y-4">
                            <label class="form-label">사업자등록증 또는 법인 검증 서류 <span aria-hidden="true"
                                    class="text-red-500">*</span></label>
                            <label class="drop-zone block" for="file-upload">
                                <div class="space-y-3 text-center">
                                    <span class="material-symbols-outlined text-5xl text-gray-400">cloud_upload</span>
                                    <div class="flex items-center justify-center gap-2">
                                        <span
                                            class="bg-[var(--kr-gov-blue)] text-white px-4 py-2 rounded-[var(--kr-gov-radius)] text-sm font-bold hover:bg-[var(--kr-gov-blue-hover)] transition-all">파일
                                            선택</span>
                                        <input class="sr-only" id="file-upload" name="fileUpload" type="file"
                                            required />
                                    </div>
                                    <p class="text-xs text-gray-500 mt-2">PDF, JPG, PNG 파일만 업로드 가능하며, 최대 용량은 10MB입니다.
                                    </p>
                                </div>
                            </label>
                        </div>
                    </section>

                    <div class="pt-8 border-t border-gray-100 flex flex-col md:flex-row gap-4">
                        <button onclick="history.back()"
                            class="flex-1 h-14 border border-[var(--kr-gov-border-light)] text-[var(--kr-gov-text-primary)] text-lg font-bold rounded-[var(--kr-gov-radius)] hover:bg-gray-50 transition-colors"
                            type="button">이전</button>
                        <button
                            class="flex-[2] h-14 bg-[var(--kr-gov-blue)] text-white text-lg font-bold rounded-[var(--kr-gov-radius)] hover:bg-[var(--kr-gov-blue-hover)] transition-colors shadow-lg flex items-center justify-center gap-2"
                            type="submit">
                            회원사 등록 및 계속하기 <span class="material-symbols-outlined">arrow_forward</span>
                        </button>
                    </div>
                </form>
            </div>
            <div class="mt-8 text-center">
                <p class="text-sm text-[var(--kr-gov-text-secondary)]">도움이 필요하신가요? <a
                        class="text-[var(--kr-gov-blue)] font-bold hover:underline" href="#">고객지원센터(1588-1234)</a>로 문의해
                    주세요.</p>
            </div>
        </div>
    </main>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
            (function loadSharedLayout() {
                fetch('/home3/fragments/header').then(r => r.text()).then(html => {
                    document.getElementById('shared-header').innerHTML = html;
                    const ko = document.getElementById('langKoBtn');
                    const en = document.getElementById('langEnBtn');
                    if (ko) ko.onclick = () => location.href = '/join/companyRegister';
                    if (en) en.onclick = () => location.href = '/join/en/companyRegister';
                }).catch(() => { });
                fetch('/home3/fragments/footer').then(r => r.text()).then(html => {
                    document.getElementById('shared-footer').innerHTML = html;
                }).catch(() => { });
            })();

        // 다음 우편번호 검색 API
        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function (data) {
                    // 도로명 주소의 노출 규칙에 따라 주소를 표시한다.
                    var addr = ''; // 주소 변수
                    var extraAddr = ''; // 참고항목 변수

                    //사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
                    if (data.userSelectedType === 'R') { // 사용자가 도로명 주소를 선택했을 경우
                        addr = data.roadAddress;
                    } else { // 사용자가 지번 주소를 선택했을 경우(J)
                        addr = data.jibunAddress;
                    }

                    // 우편번호와 주소 정보를 해당 필드에 넣는다.
                    document.getElementById('zip-code').value = data.zonecode;
                    document.getElementById("company-address").value = addr;
                    // 커서를 상세주소 필드로 이동한다.
                    document.getElementById("company-address-detail").focus();
                }
            }).open();
        }
    </script>
</body>

</html>
